[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"malyz3r/tests/*" = ["E402"]
"scripts/*" = ["E402"]


[tool.pyright]
include = [".", "malware_scanner", "tests", "scripts", "malyz3r"]
extraPaths = [".", "tests", "malyz3r", "malyz3r/tests", "typings"]
stubPath = "typings"
reportMissingImports = "none"
reportMissingTypeStubs = "none"

